name: Check deployment runner

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-eks-feedback
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    environment: feedback
    runs-on: [self-hosted, linux, x64, fruition-feedback]
    timeout-minutes: 10
    env:
      AWS_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: 'true'
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Set temporary kubeconfig path
        run: echo "KUBECONFIG=$RUNNER_TEMP/fruition-check-kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Verify identity, private endpoint and deployment RBAC
        run: bash scripts/aws-runner-check.sh
      - name: Remove kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG"
