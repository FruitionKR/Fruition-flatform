name: Publish image release
run-name: Publish tested main images

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-image-release
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main' && vars.AWS_IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.discover.outputs.ready }}
      release: ${{ steps.discover.outputs.release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Find tested source revisions
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aws_image_release.py discover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.discover.outputs.ready == 'true'
        with:
          name: release-input
          path: release.json
          retention-days: 7

  build:
    needs: discover
    if: needs.discover.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [access-svc, document-svc, pipeline, converter]
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-input
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Prepare tested source or reuse immutable image
        id: source
        run: python3 scripts/aws_image_release.py prepare-build --service "$SERVICE" --output "$SERVICE.json"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.source.outputs.build == 'true'
      - name: Build and push with service cache
        id: image
        if: steps.source.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.source.outputs.context }}
          file: ${{ steps.source.outputs.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.source.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.source=${{ steps.source.outputs.repository }}
          cache-from: type=gha,version=2,scope=fruition-${{ matrix.service }}
          cache-to: type=gha,version=2,scope=fruition-${{ matrix.service }},mode=max,timeout=2m,ignore-error=true
      - name: Verify pushed digest
        if: steps.source.outputs.build == 'true'
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/aws_image_release.py record-build --service "$SERVICE" --output "$SERVICE.json" --digest "$BUILT_DIGEST"
      - name: Remove registry login
        if: always() && steps.source.outputs.registry != ''
        env:
          REGISTRY: ${{ steps.source.outputs.registry }}
        run: docker logout "$REGISTRY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.json
          retention-days: 7

  publish:
    needs: [discover, build]
    if: needs.discover.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.discover.outputs.release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: results
      - name: Publish complete release for operator selection
        run: |
          set -euo pipefail
          python3 scripts/aws_image_release.py finalize
          python3 scripts/aws_image_release.py notes
          TAG="images-$RELEASE_SHA"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Images $RELEASE_SHA" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          printf 'Published image version: %s\n\nSelect this version in **Deploy (EKS)**, then approve the feedback deployment.\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
