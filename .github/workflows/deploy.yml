# Environment의 required reviewers와 배포 branch 제한은 GitHub 관리자가 별도로 설정한다.
name: Deploy (EKS)
run-name: '${{ inputs.action }} images ${{ inputs.release_sha || inputs.rollback_sha }}'

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy 또는 동일 schema의 성공 SHA 재배포"
        type: choice
        options: [deploy, rollback, bootstrap]
        default: deploy
      bootstrap_probe_recovery:
        description: "미완료 최초 설치의 Access probe timeout 1→5초 복구 승인"
        type: boolean
        default: false
      bootstrap_mail_health_recovery:
        description: "미완료 최초 설치의 SMTP 반복 health 인증 제외 복구 승인"
        type: boolean
        default: false
      bootstrap_oauth_recovery:
        description: "준비 완료된 최초 deploy의 Access OAuth Secret 연결 6개 추가 승인"
        type: boolean
        default: false
      release_sha:
        description: "GitHub Releases의 Images 버전에서 40자리 ID 복사 (platform 커밋 SHA 아님)"
        type: string
        default: ""
      rollback_sha:
        description: "rollback일 때 기존 성공 release의 40자리 SHA"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-eks-feedback
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: feedback
    # 고정 egress 또는 VPC 안에서 운영하는 전용 runner. PR 검증 runner와 분리한다.
    runs-on: [self-hosted, linux, x64, fruition-feedback]
    timeout-minutes: 90
    env:
      AWS_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: 'true'
      EKS_CLUSTER: fruition-eks
      DEPLOY_CONFIG: ${{ vars.AWS_DEPLOY_CONFIG_JSON }}
      ACTION: ${{ inputs.action }}
      BOOTSTRAP_PROBE_RECOVERY: ${{ inputs.bootstrap_probe_recovery }}
      BOOTSTRAP_MAIL_HEALTH_RECOVERY: ${{ inputs.bootstrap_mail_health_recovery }}
      BOOTSTRAP_OAUTH_RECOVERY: ${{ inputs.bootstrap_oauth_recovery }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - name: Set temporary kubeconfig path
        run: echo "KUBECONFIG=$RUNNER_TEMP/fruition-kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install render dependency
        run: |
          python3.12 -m venv "$RUNNER_TEMP/fruition-venv"
          "$RUNNER_TEMP/fruition-venv/bin/pip" install PyYAML==6.0.2
          echo "$RUNNER_TEMP/fruition-venv/bin" >> "$GITHUB_PATH"
      - name: Validate and render before AWS mutation
        run: |
          set -euo pipefail
          SHA="$RELEASE_SHA"
          if [ "$ACTION" = rollback ]; then SHA="$ROLLBACK_SHA"; fi
          printf '%s' "$DEPLOY_CONFIG" > "$RUNNER_TEMP/deploy-config.json"
          python scripts/aws_deploy.py render --config "$RUNNER_TEMP/deploy-config.json" --sha "$SHA" > "$RUNNER_TEMP/rendered.yaml"
          echo "IMAGE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (OIDC)
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true
      - name: Verify target account
        run: |
          set -euo pipefail
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED=$(python -c 'import json,os; print(json.loads(os.environ["DEPLOY_CONFIG"])["account_id"])')
          test "$ACTUAL" = "$EXPECTED"
      - name: Verify published immutable images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/aws_image_release.py verify --release "$IMAGE_SHA"
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Deploy with DB, migration, rollout and smoke gates
        env:
          AWS_SMOKE_EMAIL: ${{ secrets.AWS_SMOKE_EMAIL }}
          AWS_SMOKE_PASSWORD: ${{ secrets.AWS_SMOKE_PASSWORD }}
          AWS_SMOKE_WORKSPACE_ID: ${{ vars.AWS_SMOKE_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$BOOTSTRAP_PROBE_RECOVERY" = true ]; then EXTRA+=(--bootstrap-probe-recovery); fi
          if [ "$BOOTSTRAP_MAIL_HEALTH_RECOVERY" = true ]; then EXTRA+=(--bootstrap-mail-health-recovery); fi
          if [ "$BOOTSTRAP_OAUTH_RECOVERY" = true ]; then EXTRA+=(--bootstrap-oauth-recovery); fi
          python scripts/aws_deploy.py "$ACTION" --config "$RUNNER_TEMP/deploy-config.json" --sha "$IMAGE_SHA" --review "docs/releases/$IMAGE_SHA.json" "${EXTRA[@]}"
      - name: Verify large PDF multipart upload, Range read, batch conversion and AI
        # deploy 전용 gate. bootstrap/rollback은 제외하며 실패 시 아래 Discord 알림이 실행된다.
        if: inputs.action == 'deploy'
        env:
          AWS_SMOKE_EMAIL: ${{ secrets.AWS_SMOKE_EMAIL }}
          AWS_SMOKE_PASSWORD: ${{ secrets.AWS_SMOKE_PASSWORD }}
          AWS_SMOKE_WORKSPACE_ID: ${{ vars.AWS_SMOKE_WORKSPACE_ID }}
        run: python scripts/aws_pdf_smoke.py --config "$RUNNER_TEMP/deploy-config.json" --report "$RUNNER_TEMP/pdf-smoke-report.json"
      - name: Notify deployment failure through operations Discord
        if: failure() && steps.aws_credentials.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/aws-deploy-notify.py
      - name: Remove temporary deployment files
        if: always()
        run: |
          rm -f "$KUBECONFIG" "$RUNNER_TEMP/deploy-config.json" "$RUNNER_TEMP/rendered.yaml" "$RUNNER_TEMP/pdf-smoke-report.json"
          rm -rf "$RUNNER_TEMP/fruition-venv"
