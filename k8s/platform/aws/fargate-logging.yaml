# Fargate frontend Pod 로그를 기존 Container Insights application log group으로 보낸다.
# Fargate에는 DaemonSet 수집기가 돌지 않아 EKS 내장 Fluent Bit 라우터를 이 ConfigMap으로 켠다.
# 이름(aws-observability/aws-logging)과 namespace label은 EKS가 요구하는 고정값이다.
apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  flb_log_cw: "false"
  output.conf: |
    [OUTPUT]
        Name cloudwatch_logs
        Match *
        region ap-northeast-2
        log_group_name /aws/containerinsights/fruition-eks/application
        log_stream_prefix fargate-
        auto_create_group false
