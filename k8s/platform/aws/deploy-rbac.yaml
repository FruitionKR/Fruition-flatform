# 인프라 관리자가 설치한다. 앱 deployer는 Role/Binding·cluster 리소스를 변경하지 못한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-deployer
  namespace: fruition
rules:
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [elbv2.k8s.aws]
    resources: [targetgroupbindings]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [internal-only-ingress]
    verbs: [delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools, kafkatopics, kafkausers]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [keda.sh]
    resources: [scaledobjects, triggerauthentications]
    verbs: [get, list, watch, create, update, patch]
  # API Pod의 CPU 기준 HPA. KEDA는 Kafka 적체만 보므로 HTTP 트래픽 구간은 HPA가 담당한다.
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-deployer
  namespace: fruition
subjects:
  - kind: Group
    name: fruition:deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: application-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fruition-platform-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [fruition]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [gp3]
    verbs: [get]
  - apiGroups: [external-secrets.io]
    resources: [clustersecretstores]
    resourceNames: [aws-secrets-manager]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fruition-platform-reader
subjects:
  - kind: Group
    name: fruition:deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: fruition-platform-reader
  apiGroup: rbac.authorization.k8s.io
---
# runner 호스트의 운영자(fruition:operators)는 기존 Pod 상태·로그와 Deployment만 조회한다.
# Pod 생성은 임의 Secret 주입·명령 실행을 허용하므로 조회 역할에 부여하지 않는다.
# DB 조회 Pod는 별도 승인된 관리 주체가 생성한다. SQL helper의 문자열 검사는 권한 경계가 아니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operations-query
  namespace: fruition
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operations-query
  namespace: fruition
subjects:
  - kind: Group
    name: fruition:operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: operations-query
  apiGroup: rbac.authorization.k8s.io
