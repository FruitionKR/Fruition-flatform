# Strimzi generates per-client certificates; no private key is stored in Git.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-document
  namespace: fruition
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: ai.ingest.command
        patternType: literal
      operations:
      - Write
      - Describe
      host: '*'
    - resource:
        type: topic
        name: ai.query.command
        patternType: literal
      operations:
      - Write
      - Describe
      host: '*'
    - resource:
        type: topic
        name: ai.agent.command
        patternType: literal
      operations:
      - Write
      - Describe
      host: '*'
    - resource:
        type: topic
        name: ai.maintenance.command
        patternType: literal
      operations:
      - Write
      - Describe
      host: '*'
    - resource:
        type: topic
        name: document.edit.event
        patternType: literal
      operations:
      - Write
      - Describe
      host: '*'
    - resource:
        type: topic
        name: ai.task.event
        patternType: literal
      operations:
      - Read
      - Describe
      host: '*'
    - resource:
        type: group
        name: document-svc-ai-task-result
        patternType: literal
      operations:
      - Read
      - Describe
      host: '*'
    - resource:
        type: cluster
      operations:
      - IdempotentWrite
      host: '*'
---
