# AWS only: mutually authenticated TLS, topic/group ACLs and allowed client pods.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: fruition
spec:
  kafka:
    listeners:
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: tls
      networkPolicyPeers:
      - podSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - document-svc
            - ingest-worker
            - query-task-worker
            - agent-task-worker
            - maintenance-task-worker
            - edit-event-consumer
      - podSelector:
          matchLabels:
            strimzi.io/cluster: kafka
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: keda
        podSelector:
          matchLabels:
            app.kubernetes.io/name: keda-operator
    authorization:
      type: simple
  entityOperator:
    # topicOperator와 동일한 이유로 AdminClient 재접속 로그를 억제한다 (base/kafka.yaml 참조).
    userOperator:
      logging:
        type: inline
        loggers:
          logger.adminmeta.name: org.apache.kafka.clients.admin.internals.AdminMetadataManager
          logger.adminmeta.level: WARN
          logger.netclient.name: org.apache.kafka.clients.NetworkClient
          logger.netclient.level: ERROR
