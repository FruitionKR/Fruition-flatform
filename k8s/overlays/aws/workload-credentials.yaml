  name: converter
  namespace: fruition
spec:
  template:
    spec:
      serviceAccountName: fruition-converter
      automountServiceAccountToken: false
      containers:
      - name: converter
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: OPENAI_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: GEMINI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: ANTHROPIC_API_KEY
        - name: AI_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: AI_DATABASE_URL
---
# embedding-server는 내부 토큰 검증만 하므로 fruition-pipeline secret의 INTERNAL_CALLBACK_TOKEN 하나만 받는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-server
  namespace: fruition
spec:
  template:
    spec:
      serviceAccountName: fruition-pipeline
      automountServiceAccountToken: false
      containers:
      - name: embedding-server
        env:
        - $patch: replace
        - name: INTERNAL_CALLBACK_TOKEN
          valueFrom:
            secretKeyRef:
              name: fruition-pipeline
              key: INTERNAL_CALLBACK_TOKEN
