apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-svc
  namespace: fruition
spec:
  template:
    spec:
      serviceAccountName: fruition-access
      automountServiceAccountToken: false
      containers:
      - name: access-svc
        env:
        - $patch: replace
        - name: MANAGEMENT_PORT
          value: '8082'
        - name: REDIS_USERNAME
          value: access
        envFrom:
        - configMapRef:
            name: fruition-config
        - secretRef:
            name: fruition-access
---
