apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
  namespace: fruition
spec:
  template:
    spec:
      serviceAccountName: fruition-converter
      automountServiceAccountToken: false
      containers:
      - name: converter
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: OPENAI_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: GEMINI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: fruition-converter
              key: ANTHROPIC_API_KEY
