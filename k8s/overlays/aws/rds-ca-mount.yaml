# Public AWS RDS CA certificates. JDBC default path supports older deployed images too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-svc
  namespace: fruition
spec:
  template:
    spec:
      volumes:
      - name: rds-ca
        configMap:
          name: fruition-rds-ca
      containers:
      - name: access-svc
        volumeMounts:
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        - name: rds-ca
          mountPath: /home/appuser/.postgresql
          readOnly: true
---
