apiVersion: batch/v1
kind: Job
metadata:
  name: access-migration
  namespace: fruition
spec:
  template:
    spec:
      volumes:
      - name: rds-ca
        configMap:
          name: fruition-rds-ca
      containers:
      - name: migration
        volumeMounts:
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        - name: rds-ca
          mountPath: /home/appuser/.postgresql
          readOnly: true
        env:
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /etc/rds-ca/root.crt
---
