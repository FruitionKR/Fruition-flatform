apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fruition-access
  namespace: fruition
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fruition-access
    creationPolicy: Owner
  data:
  - secretKey: ACCESS_DB_RUNTIME_PASSWORD
    remoteRef:
      key: fruition/app
      property: ACCESS_DB_RUNTIME_PASSWORD
  - secretKey: JWT_SECRET
    remoteRef:
      key: fruition/app
      property: JWT_SECRET
  - secretKey: INTERNAL_CALLBACK_TOKEN
    remoteRef:
      key: fruition/app
      property: INTERNAL_CALLBACK_TOKEN
  - secretKey: MFA_ENCRYPTION_KEY
    remoteRef:
      key: fruition/app
      property: MFA_ENCRYPTION_KEY
  - secretKey: SPRING_MAIL_HOST
    remoteRef:
      key: fruition/app
      property: SPRING_MAIL_HOST
  - secretKey: SPRING_MAIL_USERNAME
    remoteRef:
      key: fruition/app
      property: SPRING_MAIL_USERNAME
  - secretKey: SPRING_MAIL_PASSWORD
    remoteRef:
      key: fruition/app
      property: SPRING_MAIL_PASSWORD
  - secretKey: MAIL_FROM
    remoteRef:
      key: fruition/app
      property: MAIL_FROM
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: fruition/app
      property: ACCESS_REDIS_PASSWORD
---
