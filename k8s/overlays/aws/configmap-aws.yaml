# 상태 계층을 관리형 서비스로 교체하는 env 패치.
# REPLACE_ME_* 는 terraform output(rds_endpoint·redis_endpoint·s3_bucket)과 도메인 결정값으로 치환.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fruition-config
  namespace: fruition
data:
  SPRING_PROFILES_ACTIVE: "production"
  # 먼저 document V117 배포 및 기존 가입자 면제 명단 반영을 완료한다.
  BILLING_ENFORCE: "true"
  AUTH_REFRESH_COOKIE_SECURE: "true"
  # POSTGRES_HOST는 서비스별 RDS가 달라 configmap이 아니라 각 deployment env로 주입
  # (kustomization.yaml의 access-svc/document-svc patch 참조)
  REDIS_HOST: "REPLACE_ME_REDIS_ENDPOINT"
  S3_ENDPOINT: "https://s3.ap-northeast-2.amazonaws.com"
  S3_BUCKET: "REPLACE_ME_S3_BUCKET"
  # 화면 주소(ALB에서 화면·API를 같은 호스트로 제공)만 허용 (§7)
  CORS_ALLOWED_ORIGINS: "https://REPLACE_ME_APP_DOMAIN"
  OAUTH_FRONTEND_REDIRECT_URI: "https://REPLACE_ME_APP_DOMAIN/oauth/callback"
  WORKSPACE_INVITATION_ACCEPT_URL: "https://REPLACE_ME_APP_DOMAIN/invitations"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
  S3_CREDENTIALS_MODE: "aws"
  AWS_REGION: "ap-northeast-2"
  REDIS_SSL: "true"
  PGSSLMODE: "verify-full"
  PGSSLROOTCERT: "/etc/rds-ca/root.crt"
  # JDBC does not consume the libpq environment variable itself.
  SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLROOTCERT: "/etc/rds-ca/root.crt"
  SPRING_MAIL_PORT: "REPLACE_ME_SMTP_PORT"
  # AI 사용량 제한은 운영 판단 전까지 의도적으로 끈다. 켤 때 "true"로 바꾼다.
  # 업로드 제한은 코드 기본값(켜짐)을 그대로 쓰므로 키를 두지 않는다.
  AI_LIMIT_ENABLED: "false"
  # 채팅 답변 듣기(TTS)는 비용 때문에 끈다. document-svc가 합성 요청을 403으로 거절하고 화면은 듣기 버튼을 숨긴다.
  # 음성 입력·회의 받아쓰기는 영향 없음. 다시 켤 때 "true"로 바꾸고 document-svc를 재시작한다(프론트 재빌드 불필요).
  SPEECH_SYNTHESIS_ENABLED: "false"
  # Ready 전 임베딩 모델 적재 상태만 확인한다. 일반 연결 오류를 기동 중 안내로 오인하지 않는다.
  EMBEDDING_STARTUP_STATUS_URL: "http://embedding-server-startup:8000"
