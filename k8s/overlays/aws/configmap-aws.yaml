# 상태 계층을 관리형 서비스로 교체하는 env 패치.
# REPLACE_ME_* 는 terraform output(rds_endpoint·redis_endpoint·s3_bucket)과 도메인 결정값으로 치환.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fruition-config
  namespace: fruition
data:
  # access의 MCP client metadata(CIMD) 조회 제한. MCP OAuth를 켠 뒤에도 그대로 쓴다.
  SPRING_APPLICATION_JSON: '{"app":{"mcp":{"oauth":{"client-metadata":{"max-response-bytes":65536,"timeout":"2s"}}}}}'
  SPRING_PROFILES_ACTIVE: "production"
  # 먼저 document V117 배포 및 기존 가입자 면제 명단 반영을 완료한다.
  BILLING_ENFORCE: "true"
  AUTH_REFRESH_COOKIE_SECURE: "true"
  # POSTGRES_HOST는 서비스별 RDS가 달라 configmap이 아니라 각 deployment env로 주입
  # (kustomization.yaml의 access-svc/document-svc patch 참조)
  REDIS_HOST: "REPLACE_ME_REDIS_ENDPOINT"
  S3_ENDPOINT: "https://s3.ap-northeast-2.amazonaws.com"
  S3_BUCKET: "REPLACE_ME_S3_BUCKET"
  # 화면 주소(ALB에서 화면·API를 같은 호스트로 제공)만 허용 (§7)
  CORS_ALLOWED_ORIGINS: "https://REPLACE_ME_APP_DOMAIN"
  OAUTH_FRONTEND_REDIRECT_URI: "https://REPLACE_ME_APP_DOMAIN/oauth/callback"
  WORKSPACE_INVITATION_ACCEPT_URL: "https://REPLACE_ME_APP_DOMAIN/invitations"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
  S3_CREDENTIALS_MODE: "aws"
  AWS_REGION: "ap-northeast-2"
  REDIS_SSL: "true"
  PGSSLMODE: "verify-full"
  PGSSLROOTCERT: "/etc/rds-ca/root.crt"
  # JDBC does not consume the libpq environment variable itself.
  SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLROOTCERT: "/etc/rds-ca/root.crt"
  SPRING_MAIL_PORT: "REPLACE_ME_SMTP_PORT"
  # AI 사용량 제한은 운영 판단 전까지 의도적으로 끈다. 켤 때 "true"로 바꾼다.
  # 업로드 제한은 코드 기본값(켜짐)을 그대로 쓰므로 키를 두지 않는다.
  AI_LIMIT_ENABLED: "false"
  # 채팅 답변 듣기(TTS)는 비용 때문에 끈다. document-svc가 합성 요청을 403으로 거절하고 화면은 듣기 버튼을 숨긴다.
  # 음성 입력·회의 받아쓰기는 영향 없음. 다시 켤 때 "true"로 바꾸고 document-svc를 재시작한다(프론트 재빌드 불필요).
  SPEECH_SYNTHESIS_ENABLED: "false"
  # Ready 전 임베딩 모델 적재 상태만 확인한다. 일반 연결 오류를 기동 중 안내로 오인하지 않는다.
  EMBEDDING_STARTUP_STATUS_URL: "http://embedding-server-startup:8000"

  # --- MCP (외부 AI 연결) ---
  # 공개 주소는 화면 호스트 하나다. /mcp는 document, OAuth는 access, /mcp/* 화면은 frontend가 받는다(ingress.yaml).
  # 비밀값 MCP_CURSOR_SECRET(document)·MCP_WIKI_SEARCH_CURSOR_HMAC_KEY(pipeline)는 external-secrets.yaml로 받는다.
  # access: MCP OAuth 인가 서버. access token은 기존 RSA 키(JWT_SIGNING_MODE 기본 rsa)로 서명한다.
  MCP_OAUTH_ENABLED: "true"
  MCP_OAUTH_FRONTEND_AUTHORIZATION_URI: "https://REPLACE_ME_APP_DOMAIN/mcp/authorize"
  APP_MCP_OAUTH_ISSUER: "https://REPLACE_ME_APP_DOMAIN"
  APP_MCP_OAUTH_RESOURCE: "https://REPLACE_ME_APP_DOMAIN/mcp"
  APP_MCP_OAUTH_AUTHORIZATION_CODE_TTL: "2m"
  APP_MCP_OAUTH_ACCESS_TOKEN_TTL: "15m"
  APP_MCP_OAUTH_REFRESH_TOKEN_TTL: "8h"
  APP_MCP_OAUTH_PENDING_AUTHORIZATION_TTL: "5m"
  # document: MCP 서버. MCP_RESOURCE_URI는 frontend.yaml의 같은 이름 값과 같아야 한다.
  MCP_ENABLED: "true"
  MCP_RESOURCE_URI: "https://REPLACE_ME_APP_DOMAIN/mcp"
  MCP_AUTHORIZATION_SERVER_URI: "https://REPLACE_ME_APP_DOMAIN"
  MCP_ALLOWED_ORIGINS: "https://REPLACE_ME_APP_DOMAIN"
  MCP_REVIEW_ORIGIN: "https://REPLACE_ME_APP_DOMAIN"
  # 클러스터 내부 호출이라 http다. document가 내부 주소의 http를 허용하는 이미지여야 기동한다.
  MCP_WIKI_SEARCH_URI: "http://pipeline-api:8000/internal/mcp/wiki/search"
  MCP_MAX_PAGE_SIZE: "20"
  MCP_MAX_CANDIDATES: "100"
  MCP_MAX_RESPONSE_BYTES: "1048576"
  MCP_MAX_CURSOR_BYTES: "8192"
  MCP_MAX_SOURCE_BLOCKS: "500"
  MCP_MAX_SOURCE_BYTES: "1048576"
  MCP_MAX_DOCUMENT_BLOCKS_PER_PAGE: "100"
  MCP_MAX_DOCUMENT_CONTENT_BYTES: "524288"
  # document → pipeline MCP 호출 read timeout. pipeline 위키 검색 deadline(MCP_WIKI_SEARCH_DEADLINE_MS 8초)보다 길어야 한다.
  MCP_DEPENDENCY_TIMEOUT_SECONDS: "10"
  MCP_WIKI_MAX_SOURCE_DOCUMENTS: "20"
  MCP_WIKI_MAX_TOTAL_SOURCE_BYTES: "10485760"
  # MCP_PDF_SOURCE_ENDPOINT는 local 저장소 전용이라 두지 않는다(aws 모드는 기본 S3 클라이언트로 서명).
  # 가격(원화, 최소 단위 1원). 문서 수정 승인은 무료, 위키 편입은 원문 1MiB당 1원, 위키 정리는 반영 1회 1원.
  MCP_APPROVAL_UNIT_PRICE_MINOR: "0"
  MCP_APPROVAL_PLAN_CAP_MINOR: "0"
  MCP_APPROVAL_CURRENCY: "KRW"
  MCP_APPROVAL_PRICE_VERSION: "mcp-launch-2026-11"
  # 현재 코드는 읽지 않는 기록용 값이다. 결과를 모르는 승인은 대사로 확정될 때까지 지우지 않는다.
  MCP_APPROVAL_UNRESOLVED_RETENTION_POLICY: "retain-until-reconciled"
  MCP_WIKI_CURRENCY: "KRW"
  MCP_WIKI_INGEST_UNIT_PRICE_MINOR: "1"
  MCP_WIKI_INGEST_UNIT_SIZE: "1048576"
  MCP_WIKI_INGEST_UNIT: "source_bytes_per_1048576"
  MCP_WIKI_INGEST_FORMULA: "ceil(source_bytes/1048576)*1"
  MCP_WIKI_INGEST_PRICE_VERSION: "mcp-launch-2026-11"
  MCP_WIKI_LINT_FIXED_PRICE_MINOR: "1"
  MCP_WIKI_LINT_UNIT: "apply"
  MCP_WIKI_LINT_FORMULA: "fixed 1 KRW per apply"
  MCP_WIKI_LINT_PRICE_VERSION: "mcp-launch-2026-11"
  # pipeline: MCP 위키 검색·페이지 읽기(mcp_read). 값이 없으면 503으로 닫힌다.
  MCP_WIKI_SEARCH_MAX_STRING_CHARS: "512"
  MCP_WIKI_SEARCH_MAX_PAGE_SIZE: "20"
  # MAX_CANDIDATES·MAX_SCAN_PAGES는 Fruition-ai #262 이후 읽지 않는다. 배포된 이전 이미지가 요구하므로 새 이미지 배포 뒤 지운다.
  MCP_WIKI_SEARCH_MAX_CANDIDATES: "100"
  # ADR 0046 후보 조회 상한: workspace 검색 unit 본문 UTF-8 byte 합. unit 상한 × 약 500B(≈5MB)보다 넉넉히 둬 unit 상한이 먼저 걸린다.
  MCP_WIKI_SEARCH_MAX_CANDIDATE_BYTES: "8388608"
  # 10000 unit 점수 계산(로컬 약 4초)과 질문 임베딩·Jev 판정이 함께 끝나는 시간.
  MCP_WIKI_SEARCH_DEADLINE_MS: "8000"
  MCP_WIKI_SEARCH_MAX_REQUEST_BYTES: "65536"
  MCP_WIKI_SEARCH_MAX_RESPONSE_BYTES: "1048576"
  MCP_WIKI_SEARCH_MAX_SCAN_PAGES: "100"
  # ADR 0046 후보 조회 상한: workspace 검색 unit 행 수(문서 약 50개 규모). 넘으면 일부만 검색하지 않고 503.
  MCP_WIKI_SEARCH_MAX_SCAN_UNITS: "10000"
  MCP_WIKI_SEARCH_MAX_VECTOR_DIMENSIONS: "4096"
  MCP_WIKI_PAGE_MAX_ID_CHARS: "255"
  MCP_WIKI_PAGE_MAX_METADATA_BYTES: "65536"
  MCP_WIKI_PAGE_MAX_BODY_BYTES: "524288"
  MCP_WIKI_PAGE_MAX_RESPONSE_BYTES: "1048576"
  MCP_WIKI_PAGE_DEADLINE_MS: "5000"
  MCP_WIKI_PAGE_DB_CONNECT_TIMEOUT_MS: "1000"
  MCP_WIKI_PAGE_DB_STATEMENT_TIMEOUT_MS: "3000"
  MCP_WIKI_PAGE_STORAGE_CONNECT_TIMEOUT_MS: "1000"
  MCP_WIKI_PAGE_STORAGE_READ_TIMEOUT_MS: "3000"
  # pipeline: MCP 위키 편입·정리 초안(mcp_wiki_draft). 제품 기본값이 없어 하나라도 빠지면 503으로 닫힌다.
  # 원문 한도는 document의 MCP_MAX_SOURCE_*·MCP_WIKI_MAX_*와 맞춘다.
  MCP_WIKI_DRAFT_MAX_REQUEST_BYTES: "1048576"
  MCP_WIKI_DRAFT_SOURCE_TIMEOUT_SECONDS: "10"
  MCP_WIKI_DRAFT_SOURCE_RESPONSE_MAX_BYTES: "4194304"
  MCP_WIKI_DRAFT_SOURCE_MAX_BLOCKS: "500"
  MCP_WIKI_DRAFT_SOURCE_MAX_TEXT_BYTES: "1048576"
  MCP_WIKI_DRAFT_WINDOW_MAX_BLOCKS: "50"
  MCP_WIKI_DRAFT_WINDOW_MAX_TEXT_BYTES: "65536"
  MCP_WIKI_DRAFT_MAX_ACTIVE_PER_USER: "4"
  MCP_WIKI_DRAFT_MAX_ACTIVE_PER_WORKSPACE: "8"
  MCP_WIKI_DRAFT_MAX_ACTIVE_STORAGE_BYTES: "16777216"
  # 웹 승인 대기도 TTL 대상이라 하루를 준다.
  MCP_WIKI_DRAFT_RUN_TTL_SECONDS: "86400"
  MCP_WIKI_DRAFT_MAX_CONTRIBUTIONS: "20"
  MCP_WIKI_DRAFT_MAX_STATEMENTS: "50"
  MCP_WIKI_DRAFT_MAX_EVIDENCE_PER_STATEMENT: "3"
  MCP_WIKI_DRAFT_MAX_LINKS: "20"
  MCP_WIKI_DRAFT_MAX_NAME_CHARS: "200"
  MCP_WIKI_DRAFT_MAX_STATEMENT_CHARS: "1000"
  MCP_WIKI_DRAFT_MAX_QUOTE_CHARS: "1000"
  # 문장 단어 중 근거 인용에 있는 단어 비율의 하한.
  MCP_WIKI_DRAFT_LEXICAL_OVERLAP_THRESHOLD: "0.5"
  # 문장·인용에 들어가면 거절하는 지시문 패턴(JSON 배열, Python re). ai skill/domain/safety.py의 차단 문구와 같은 계열.
  MCP_WIKI_DRAFT_INSTRUCTION_PATTERNS_JSON: '["(?i)ignore\\s+(?:all\\s+)?(?:previous|prior|above)\\s+instructions","(?i)forget\\s+(?:all\\s+)?(?:previous|prior)\\s+instructions","(?i)ignore\\s+(?:the\\s+)?system\\s+(?:prompt|policy)","(?i)(?:reveal|show|print)\\s+(?:the\\s+)?system\\s+prompt","이전\\s*지시(?:를|사항을)?\\s*무시","시스템\\s*(?:정책|프롬프트)(?:을|를)?\\s*무시","시스템\\s*프롬프트(?:를)?\\s*(?:보여|출력|공개)"]'
  MCP_WIKI_DRAFT_VALIDATION_POLICY_VERSION: "mcp-launch-2026-11"
  MCP_WIKI_DRAFT_VALIDATION_EVALSET_ID: "mcp-launch-2026-11"
  MCP_WIKI_DRAFT_PREVIEW_MAX_ITEMS: "1000"
  MCP_WIKI_DRAFT_PREVIEW_MAX_BYTES: "1048576"
  MCP_WIKI_DRAFT_PREVIEW_MAX_SOURCE_BYTES: "1048576"
  MCP_WIKI_DRAFT_LINT_MAX_OPERATIONS: "50"
  MCP_WIKI_DRAFT_LINT_MAX_TARGET_PAGES: "20"
  MCP_WIKI_DRAFT_LINT_MAX_SOURCE_SNAPSHOTS: "20"
  MCP_WIKI_DRAFT_LINT_MAX_TOTAL_SOURCE_BYTES: "10485760"
  MCP_WIKI_DRAFT_LINT_MAX_STRUCTURAL_CHANGES: "200"
  MCP_WIKI_DRAFT_LINT_MAX_DELETES: "20"
  MCP_WIKI_DRAFT_LINT_TTL_SECONDS: "86400"
  # 정리 초안이 받는 관계는 ai 요청 스키마의 concept_related_to 하나다.
  MCP_WIKI_DRAFT_LINT_RELATIONS_JSON: '["concept_related_to"]'
  MCP_WIKI_DRAFT_LINT_POLICY_VERSION: "mcp-launch-2026-11"
  # pipeline → document 승인 조회·반영 결과 전달 timeout.
  MCP_WIKI_APPROVAL_LOOKUP_TIMEOUT_SECONDS: "10"
  MCP_WIKI_PUBLICATION_RECEIPT_TIMEOUT_SECONDS: "10"
