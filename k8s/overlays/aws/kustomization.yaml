# AWS(EKS) overlay — docs/backlog/Fruition_AWS_MSA_Architecture.md §8 소규모 profile.
# 상태 계층은 RDS·ElastiCache·S3(Terraform: infra/terraform), Kafka는 base의 Strimzi 그대로.
# scripts/aws_deploy.py가 임시 사본에서 입력 치환·검증한 뒤 순차 적용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
  - ../../base
  - ingress.yaml
  - frontend.yaml
  - external-secrets.yaml
  - service-accounts.yaml
  - migration-jobs.yaml
  - api-disruption-budgets.yaml
  - api-autoscaling.yaml
  - kafka-users.yaml
  - kafka-trigger-auth.yaml

# 배포 스크립트가 임시 사본의 태그를 커밋 SHA로 설정한다.
images:
  - name: fruition-document-svc
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-document-svc
    newTag: latest
  - name: fruition-access-svc
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-access-svc
    newTag: latest
  # pipeline-api·ingest-worker는 같은 이미지(fruition-pipeline)
  - name: fruition-mvp-dev-pipeline-api
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-pipeline
    newTag: latest
  - name: fruition-mvp-dev-ingest-worker
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-pipeline
    newTag: latest
  - name: fruition-converter
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-converter
    newTag: latest
  - name: fruition-frontend
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-frontend
    newTag: latest

patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: internal-only-ingress
        namespace: fruition
      $patch: delete
  # 관리형 서비스 endpoint 주입
  - path: configmap-aws.yaml
  - path: workload-credentials.yaml
  - path: api-availability.yaml
  - target:
      kind: (Deployment|Job)
    path: pod-seccomp.yaml
  - target:
      kind: Deployment
      name: (access-svc|document-svc|pipeline-api|pipeline-agent-worker|ingest-worker|query-task-worker|agent-task-worker|maintenance-task-worker|edit-event-consumer|embedding-server)
    path: container-security.yaml
  - target:
      kind: Job
    path: container-security.yaml
  - path: kafka-security.yaml
  - path: kafka-client-tls.yaml
  - path: kafka-scalers-tls.yaml

  # NodePort(kind 전용) → ClusterIP. ALB Ingress가 대신 노출한다.
  - target:
      kind: Service
      name: document-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      kind: Service
      name: access-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort

  # imagePullPolicy Never(kind 전용) → IfNotPresent + §8.2 resource 상향
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: document-svc
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: document-svc
                imagePullPolicy: IfNotPresent
                env:
                  - name: POSTGRES_HOST
                    value: "REPLACE_ME_CORE_RDS_ENDPOINT"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
  # POSTGRES_HOST: RDS가 access/core 2대로 나뉘어 deployment별 env로 주입 (envFrom보다 우선)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: access-svc
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: access-svc
                imagePullPolicy: IfNotPresent
                env:
                  - name: POSTGRES_HOST
                    value: "REPLACE_ME_ACCESS_RDS_ENDPOINT"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pipeline-api
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: pipeline-api
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pipeline-agent-worker
        namespace: fruition
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: pipeline-agent-worker
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingest-worker
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: ingest-worker
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    memory: 4Gi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: converter
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: converter
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edit-event-consumer
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: edit-event-consumer
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: embedding-server
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: embedding-server
                imagePullPolicy: IfNotPresent
  # BGE-M3를 쓰는 worker만 semantic 검색을 켠다. query·agent는 질의 임베딩을 embedding-server에
  # 요청하고(EMBEDDING_SERVICE_URL, ai ADR-0026), maintenance는 post-ingest·복구 임베딩을 직접 만든다.
  # 모델은 fruition-pipeline 이미지에 들어 있어(오프라인 로드) 노드 디스크에는 이미지 레이어로 한 번만 저장된다.
  # 메모리: 배치 1 임베딩의 최고치가 약 2.5GB라(Fruition-ai #22) 요청 2.5Gi, 한도 3.5Gi로 둔다.
  # query·agent의 메모리 패치는 embedding-server 전환을 운영에서 확인한 뒤 제거한다.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: query-task-worker
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: query-task-worker
                imagePullPolicy: IfNotPresent
                env:
                  - name: QUERY_EMBEDDING_MODE
                    value: "bge-m3"
                  - name: EMBEDDING_SERVICE_URL
                    value: "http://embedding-server:8000"
                resources:
                  requests:
                    cpu: 500m
                    memory: 2560Mi
                  limits:
                    memory: 3584Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-task-worker
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: agent-task-worker
                imagePullPolicy: IfNotPresent
                env:
                  - name: QUERY_EMBEDDING_MODE
                    value: "bge-m3"
                  - name: EMBEDDING_SERVICE_URL
                    value: "http://embedding-server:8000"
                resources:
                  requests:
                    cpu: 500m
                    memory: 2560Mi
                  limits:
                    memory: 3584Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: maintenance-task-worker
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: maintenance-task-worker
                imagePullPolicy: IfNotPresent
                env:
                  - name: QUERY_EMBEDDING_MODE
                    value: "bge-m3"
                resources:
                  requests:
                    cpu: 500m
                    memory: 2560Mi
                  limits:
                    memory: 3584Mi
  # AI 비동기 처리와 변환을 Spot node group에 배치한다.
  - target:
      kind: Deployment
      name: (ingest-worker|pipeline-agent-worker|query-task-worker|agent-task-worker|maintenance-task-worker|edit-event-consumer|converter|embedding-server)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          fruition.io/node-role: ai-worker
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: fruition.io/ai-worker
            operator: Equal
            value: "true"
            effect: NoSchedule
  # 워커는 SIGTERM을 받으면 새 메시지를 그만 받고 진행 중인 건을 마친 뒤 offset을 commit한다(ingest/task worker).
  # 기본 30초로는 분 단위 LLM 작업이 SIGKILL로 끊겨 재전달·LLM 재호출이 된다. rollout·scale-down·노드 drain 때
  # 진행 중 건을 마칠 시간을 준다. Spot 회수는 통보 후 2분 상한이라 그 안에 끝나는 건만 살린다.
  - target:
      kind: Deployment
      name: (ingest-worker|pipeline-agent-worker|query-task-worker|agent-task-worker|maintenance-task-worker|converter)
    patch: |-
      - op: add
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 900

  - target:
      kind: Kafka
      name: kafka
    patch: |-
      - op: add
        path: /spec/kafka/version
        value: "4.3.0"
  - target:
      kind: KafkaNodePool
      name: dual-role
    patch: |-
      - op: add
        path: /spec/storage/volumes/0/class
        value: gp3

  # 외부 SMTP를 포함한 Access health는 정상 응답에도 1초를 넘을 수 있다.
  - target:
      kind: Deployment
      name: access-svc
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 5

  # Pod/ALB의 주기적 상태 검사가 SMTP 인증을 반복해 메일 계정을 잠그지 않도록 한다.
  # 실제 메일 발송 설정은 유지하며, 발송 검증은 별도로 수행한다.
  - target:
      kind: Deployment
      name: access-svc
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: access-svc
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: access-svc
                env:
                  - name: MANAGEMENT_HEALTH_MAIL_ENABLED
                    value: "false"
