# Missing optional property must not break the existing service secrets.
# Replace ensures extracted DB/API credentials never enter this target Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fruition-analytics
  namespace: fruition
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fruition-analytics
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        POSTHOG_PROJECT_TOKEN: '{{ index . "POSTHOG_PROJECT_TOKEN" | default "" }}'
  dataFrom:
    - extract:
        key: fruition/app
