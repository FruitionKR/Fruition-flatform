# API Pod는 KEDA 대상이 아니다. KEDA는 Kafka 적체만 보고 AI 작업자를 조절하므로
# HTTP 요청이 아무리 늘어도 API replicas는 2개 고정이었다. CPU 기준 HPA로 그 구간을 채운다.
#
# 상한 4의 근거 — 일반 노드는 t3.large(2 vCPU / 8GiB) 최대 4대이고 노드당 할당 가능
# CPU는 약 1.9 vCPU라 전체 약 7.6 vCPU다. 세 API가 동시에 상한에 닿으면
#   access-svc    4 x 250m = 1.0 vCPU   (base 요청값)
#   document-svc  4 x 500m = 2.0 vCPU   (overlay 요청값)
#   pipeline-api  4 x 500m = 2.0 vCPU   (overlay 요청값)
# 합계 5.0 vCPU다. 남는 2.6 vCPU를 Kafka(일반 노드 상주)·converter·edit-event-consumer와
# 노드별 DaemonSet(fluent-bit·cloudwatch-agent·ebs-csi·aws-node)이 쓴다.
# 상한을 6으로 두면 7.5 vCPU가 되어 노드 CPU를 넘고 Pending이 생긴다.
#
# 하한 2는 기존 replicas와 같다. 평상시 Pod 수가 그대로라 비용이 늘지 않는다.
# 자동 확장이 실제로 도는지는 부하 시험으로 확인해야 하며, 이 설정만으로 증명되지 않는다.
#
# metrics-server가 있어야 CPU 지표가 수집된다. 없으면 HPA가 <unknown>으로 멈춘다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: access-svc
  namespace: fruition
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: access-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      # 급증에 빠르게 반응하되 한 번에 두 배까지만 늘린다.
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      # 트래픽이 출렁일 때 축소를 반복하지 않도록 5분을 본다.
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
---
