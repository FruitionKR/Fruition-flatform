apiVersion: batch/v1
kind: Job
metadata:
  name: ai-migration
  namespace: fruition
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app: ai-migration
    spec:
      restartPolicy: Never
      serviceAccountName: fruition-ai-migration
      automountServiceAccountToken: false
      containers:
      - name: migration
        image: fruition-mvp-dev-pipeline-api:latest
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.modules.wiki_ingestion.infrastructure.migrate_ai_schema
        envFrom:
        - secretRef:
            name: fruition-ai-migration
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        env:
        - name: PGSSLMODE
          value: require
