apiVersion: batch/v1
kind: Job
metadata:
  name: access-migration
  namespace: fruition
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app: access-migration
    spec:
      restartPolicy: Never
      serviceAccountName: fruition-access-migration
      automountServiceAccountToken: false
      containers:
      - name: migration
        image: fruition-access-svc:dev
        imagePullPolicy: IfNotPresent
        args:
        - --migrate-only
        env:
        - name: POSTGRES_HOST
          value: REPLACE_ME_ACCESS_RDS_ENDPOINT
        - name: POSTGRES_PORT
          value: '5432'
        - name: ACCESS_DB_NAME
          value: access_db
        - name: ACCESS_DB_MIGRATION_USER
          value: access_migration
        - name: PGSSLMODE
          value: require
        envFrom:
        - secretRef:
            name: fruition-access-migration
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
---
