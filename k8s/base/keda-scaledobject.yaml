# converter는 command 하나가 길고 CPU·메모리를 많이 쓰므로 pod당 1건(lagThreshold 1)으로 3개까지만 늘린다.
# consumer group은 worker 기본값(`{topic}-worker`)이다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: converter
  namespace: fruition
spec:
  scaleTargetRef: {name: converter}
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.fruition.svc:9092
        consumerGroup: ai.convert.command-worker
        topic: ai.convert.command
        lagThreshold: "1"
        offsetResetPolicy: earliest
