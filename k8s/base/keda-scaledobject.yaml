# ingest-worker 등 worker를 Kafka consumer lag 기준으로 스케일.
# 사전 조건: KEDA 설치 (README 참조).
# 일이 없으면 worker를 0으로 줄여 AI Spot 노드도 0대로 내려가게 한다. 0이어도 consumer group offset은
# Kafka에 남아(base/kafka.yaml offsets.retention.minutes) lag이 생기면(activationLagThreshold 기본 0) 다시 1로 깨운다.
# 실행 중인 작업의 offset은 처리 뒤에 commit되므로 lag으로 남아, 작업 도중 0으로 줄지 않는다.
# cooldownPeriod는 마지막으로 lag이 있던 때부터 0으로 줄이기까지 기다리는 시간이다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingest-worker
  namespace: fruition
spec:
  scaleTargetRef:
    name: ingest-worker
  minReplicaCount: 0
  cooldownPeriod: 600
  maxReplicaCount: 4
  # 미커밋 offset은 실행 중 작업도 포함한다. 짧은 lag 급등으로 한 번에 증설하지 않는다.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.fruition.svc:9092
        consumerGroup: ingest-worker
        topic: ai.ingest.command
        lagThreshold: "5"
        limitToPartitionsWithLag: "true"
        offsetResetPolicy: earliest
---
