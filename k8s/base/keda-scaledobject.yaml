# converter는 command 하나가 길고 CPU·메모리를 많이 쓰므로 pod당 1건(lagThreshold 1)으로 3개까지만 늘린다.
# consumer group은 worker 기본값(`{topic}-worker`)이다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: converter
  namespace: fruition
spec:
  scaleTargetRef: {name: converter}
  minReplicaCount: 0
  cooldownPeriod: 600
  maxReplicaCount: 3
  # 미커밋 offset은 실행 중 작업도 포함한다. 짧은 lag 급등으로 한 번에 증설하지 않는다.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.fruition.svc:9092
        consumerGroup: ai.convert.command-worker
        topic: ai.convert.command
        lagThreshold: "1"
        limitToPartitionsWithLag: "true"
        offsetResetPolicy: earliest
---
# embedding-server는 query·agent worker만 HTTP로 부른다(ai ADR-0026, aws networkpolicy aws-internal-embedding-server).
# Kafka lag이 아니라 그 worker Pod 수를 따라간다. worker가 하나라도 있으면(Pending·종료 대기 포함) 1, 모두 0이 되면 0.
# worker는 init container로 이 서버의 /health를 기다린 뒤 소비를 시작한다(overlays/aws kustomization.yaml).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: embedding-server
  namespace: fruition
spec:
  scaleTargetRef: {name: embedding-server}
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: kubernetes-workload
      metadata:
        podSelector: app in (query-task-worker,agent-task-worker)
        value: "1"
