apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-agent-worker
  namespace: fruition
  labels:
    app: pipeline-agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-agent-worker
  template:
    metadata:
      labels:
        app: pipeline-agent-worker
    spec:
      containers:
        - name: pipeline-agent-worker
          image: fruition-mvp-dev-pipeline-api:latest
          imagePullPolicy: Never
          command: ["python", "agent_worker.py"]
          envFrom:
            - configMapRef:
                name: fruition-config
          env:
            - name: AI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DATABASE_URL
            - name: AI_DB_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DB_MIGRATION_URL
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: INTERNAL_CALLBACK_TOKEN
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AGENT_INTERNAL_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: ANTHROPIC_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: LANGSMITH_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: TAVILY_API_KEY
            - name: AGENT_BACKEND_URL
              value: "http://document-svc:8080"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import pathlib,sys; sys.exit(b'agent_worker.py' not in pathlib.Path('/proc/1/cmdline').read_bytes())"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
