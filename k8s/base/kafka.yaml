# 문서 편집 outbox 이벤트 (key=document_id)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: document.edit.event
  namespace: fruition
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 1
  # 문서·워크스페이스 ID, revision, content_hash만 담은 편집 알림이며 본문은 없다. 소비 지연 복구용으로 72시간 보관한다(ADR 0023).
  config:
    retention.ms: 259200000
