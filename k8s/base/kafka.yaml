# Strimzi Kafka (KRaft, single node) + ai.ingest.command 토픽.
# 사전 조건: Strimzi operator가 fruition namespace에 설치되어 있어야 한다 (README 참조).
# bootstrap DNS: kafka-kafka-bootstrap.fruition.svc:9092
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: fruition
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: fruition
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # single broker 구성
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator:
      # AdminClient는 브로커를 못 찾으면 백오프 없이 재부트스트랩을 반복하고
      # 그 과정을 INFO로 남긴다. 2026-10-04 노드그룹 롤링으로 브로커가 6분간
      # 사라졌을 때 entity-operator 한 파드가 15분에 118MiB를 쏟아 로그 유입
      # 경보를 울렸다. 두 flood 소스만 올려 운영 로그는 그대로 둔다.
      logging:
        type: inline
        loggers:
          logger.adminmeta.name: org.apache.kafka.clients.admin.internals.AdminMetadataManager
          logger.adminmeta.level: WARN
          logger.netclient.name: org.apache.kafka.clients.NetworkClient
          logger.netclient.level: ERROR
---
# partition 수 = ingest worker 병렬 상한. document_id key로 문서별 순서 보장.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ai.ingest.command
  namespace: fruition
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 12
  replicas: 1
  # 질문 원문 등 개인정보가 담겨 처리 지연 복구에 필요한 72시간만 보관한다(ADR 0023).
  config:
    retention.ms: 259200000
---
