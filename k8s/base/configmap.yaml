# 비밀이 아닌 공통 환경변수. infra/compose.containerized.yml·compose.ai.yml의
# environment 블록을 그대로 옮기고 호스트명만 k8s Service DNS로 바꿨다.
# document-svc·access-svc·pipeline-api·ingest-worker가 envFrom으로 공유한다(서로 무해한 여분 키 포함).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fruition-config
  namespace: fruition
data:
  # --- document-svc / access-svc ---
  SPRING_PROFILES_ACTIVE: "local"
  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"
  # DB 분리: access-svc → access_db, document-svc → core_db (비밀번호는 Secret)
  ACCESS_DB_NAME: "access_db"
  ACCESS_DB_RUNTIME_USER: "access_runtime"
  ACCESS_DB_MIGRATION_USER: "access_migration"
  CORE_DB_NAME: "core_db"
  CORE_DB_RUNTIME_USER: "core_runtime"
  CORE_DB_MIGRATION_USER: "core_migration"
  # Wiki 현재 상태와 pipeline run은 ai_db가 소유한다(접속 URL은 Secret).
  AI_DB_NAME: "ai_db"
  AI_DB_RUNTIME_USER: "ai_runtime"
  AI_DB_MIGRATION_USER: "ai_migration"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap:9092"
  INGEST_COMMAND_TOPIC: "ai.ingest.command"
  QUERY_COMMAND_TOPIC: "ai.query.command"
  AGENT_COMMAND_TOPIC: "ai.agent.command"
  MAINTENANCE_COMMAND_TOPIC: "ai.maintenance.command"
  AI_TASK_EVENT_TOPIC: "ai.task.event"
  DOCUMENT_EDIT_EVENT_TOPIC: "document.edit.event"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "fruition-storage"
  # ai-svc(pipeline) 내부 호출 — k8s Service DNS 경유
  PROCESSING_ENDPOINT: "http://pipeline-api:8000/pipeline/runs"
  CHAT_PROCESSING_ENDPOINT: "http://pipeline-api:8000/chat-wiki/runs"
  QUERY_ENDPOINT: "http://pipeline-api:8000/query"
  AGENT_STATUS_ENDPOINT: "http://pipeline-api:8000/internal/agent/runs"
  AGENT_RUN_ENDPOINT: "http://pipeline-api:8000/agent/runs"
  SKILL_ENDPOINT: "http://pipeline-api:8000/skills"
  WIKI_SCHEMA_ENDPOINT: "http://pipeline-api:8000/wiki-schema"
  WIKI_PAGE_ENDPOINT: "http://pipeline-api:8000/wiki/pages"
  WIKI_STATE_ENDPOINT: "http://pipeline-api:8000/wiki"
  # PDF → Markdown 변환기(converter Service, ClusterIP) — document-svc가 내부 호출
  CONVERTER_ENDPOINT: "http://converter:8000"
  # 서비스 간 내부 호출 — document-svc -> access-svc(/internal/authz·users),
  # access-svc -> document-svc(/internal/workspaces/*/initial-note)
  ACCESS_INTERNAL_BASE_URL: "http://access-svc:8081"
  DOCUMENT_INTERNAL_BASE_URL: "http://document-svc:8080"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  OAUTH_FRONTEND_REDIRECT_URI: "http://localhost:3000/oauth/callback"
  AUTH_REFRESH_COOKIE_SECURE: "false"
  # --- pipeline-api / ingest-worker ---
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: "local-pilot-dev"
  LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
  QUERY_EMBEDDING_MODE: "text-only"
  QUERY_EVALUATOR_MODE: "web"
  QUERY_EVALUATOR_MAX_ATTEMPTS: "2"
  QUERY_WEB_SEARCH_MAX_RESULTS: "5"
  QUERY_WEB_SEARCH_TIMEOUT_SECONDS: "10"
  QUERY_MIN_INTERNAL_RELEVANCE_SCORE: "0.5"
  AGENT_SKILLS_ENABLED: "true"
  SKILL_API_ENABLED: "true"
