# 로컬(kind) 개발용 시크릿. 값은 compose 파일에 이미 공개된 dev 기본값과 동일하다.
# 실제 LLM 호출이 필요하면 아래 provider별 키 중 필요한 값만 덮어쓴다:
#   kubectl -n fruition create secret generic fruition-secret \
#     --from-literal=OPENAI_API_KEY=... --dry-run=client -o yaml | kubectl apply -f -
# (운영 배포에서는 이 파일 대신 ExternalSecrets/SealedSecrets 등을 사용할 것)
apiVersion: v1
kind: Secret
metadata:
  name: fruition-secret
  namespace: fruition
type: Opaque
stringData:
  # DB 분리 계정 비밀번호 (dev 기본값 — 계정/DB 이름은 configmap.yaml 참조)
  POSTGRES_ADMIN_PASSWORD: "fruition_admin_dev_password"
  ACCESS_DB_RUNTIME_PASSWORD: "access_runtime_dev_password"
  ACCESS_DB_MIGRATION_PASSWORD: "access_migration_dev_password"
  CORE_DB_RUNTIME_PASSWORD: "core_runtime_dev_password"
  CORE_DB_MIGRATION_PASSWORD: "core_migration_dev_password"
  AI_DB_RUNTIME_PASSWORD: "ai_runtime_dev_password"
  AI_DB_MIGRATION_PASSWORD: "ai_migration_dev_password"
  # AI runtime 저장소는 모두 ai_db가 소유한다.
  AI_DATABASE_URL: "postgresql://ai_runtime:ai_runtime_dev_password@postgresql:5432/ai_db"
  # db/ai_schema.sql(멱등) 적용 계정 — pipeline-api 기동 시 사용
  AI_DB_MIGRATION_URL: "postgresql://ai_migration:ai_migration_dev_password@postgresql:5432/ai_db"
  S3_ACCESS_KEY: "fruition"
  S3_SECRET_KEY: "fruition_dev_secret"
  JWT_SECRET: "dev-only-jwt-secret-change-me-please-32bytes-min"
  INTERNAL_CALLBACK_TOKEN: "local-internal-callback"
  AGENT_INTERNAL_TOKEN: "local-agent-internal"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  LANGSMITH_API_KEY: ""
  TAVILY_API_KEY: ""
