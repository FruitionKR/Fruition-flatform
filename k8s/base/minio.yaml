apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: fruition
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fruition
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # minio/minio 공개 태그가 삭제돼 Chainguard 이미지를 digest로 고정한다(compose.infra.yml과 동일).
          image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fruition
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# compose의 minio-init와 동일: 버킷 생성 + 익명 접근 차단
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: fruition
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          # minio/mc 이미지가 사라져 AWS CLI(public ECR, digest 고정)로 버킷을 만든다. 새 버킷은 기본이 비공개다.
          image: public.ecr.aws/aws-cli/aws-cli@sha256:37458ae4e84ce11cdd92da543e72ece6d75ca73c35a0bcd3fe4571ccc882cf98
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: fruition-config
                  key: S3_BUCKET
          command:
            - /bin/sh
            - -c
            - |
              until aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null \
                 || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$S3_BUCKET"; do
                sleep 2;
              done
