# Kafka `ai.convert.command` 컨슈머 (consumer group: ai.convert.command-worker). PDF 변환 worker (ai ADR 0034).
# replicas는 KEDA ScaledObject가 1~3으로 관리한다 (keda-scaledobject.yaml).
# HTTP 서버·Service가 없어 probe는 프로세스 생존(컨테이너 종료 시 재시작) 수준으로 둔다(ingest-worker와 같다).
# compose와 동일하게 read-only rootfs + 권한 축소, /tmp만 쓰기 허용.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
  namespace: fruition
  labels:
    app: converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: converter
  template:
    metadata:
      labels:
        app: converter
    spec:
      # SIGTERM을 받아도 worker는 진행 중인 command를 끝내고(CONVERT_BATCH_DEADLINE_SECONDS 7200초) 종료한다.
      # 마감 + 종료·결과 저장 여유(600초)를 주어 rollout·scale-down 때 SIGKILL로 끊겨 재전달되는 일을 막는다.
      terminationGracePeriodSeconds: 7800
      containers:
        - name: converter
          image: fruition-converter:latest
          imagePullPolicy: Never
          env:
            - name: OCR_LANGUAGE
              value: "kor+eng"
            - name: OCR_TIMEOUT_SECONDS
              value: "600"
            - name: MARKDOWN_TIMEOUT_SECONDS
              value: "300"
            - name: PDF_DIAGNOSTIC_TIMEOUT_SECONDS
              value: "60"
            # selective repair 사용량 원장 기록용 converter 전용 계정(ai_runtime 아님)
            - name: AI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_CONVERTER_DATABASE_URL
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: ANTHROPIC_API_KEY
          envFrom:
            - configMapRef:
                name: fruition-config
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
