apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-task-worker
  namespace: fruition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-task-worker
  template:
    metadata:
      labels:
        app: maintenance-task-worker
    spec:
      # SIGTERM 뒤에도 진행 중인 작업을 끝내고 종료한다. 회의 녹음 전사 마감(MEETING_TRANSCRIPTION_DEADLINE_SECONDS 1500초)에
      # 종료·정리 여유 300초를 더한 값(= worker max_poll_interval 1800초)이다. 짧으면 rollout·scale-down 때 전사가 끊겨 재전달된다.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: maintenance-task-worker
          image: fruition-mvp-dev-pipeline-api:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.task_worker"]
          envFrom:
            - configMapRef: {name: fruition-config}
          env:
            - name: AI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DATABASE_URL
            - name: AI_DB_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DB_MIGRATION_URL
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: INTERNAL_CALLBACK_TOKEN
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AGENT_INTERNAL_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: ANTHROPIC_API_KEY
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: TYPESAFE_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: LANGSMITH_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: TAVILY_API_KEY
            - {name: AI_COMMAND_TOPIC, value: ai.maintenance.command}
            # 한 pod가 동시에 처리하는 메시지 수. 같은 Kafka 키(세션·워크스페이스)는 순서대로 하나씩 처리한다(ai ADR 0036).
            - {name: AI_TASK_CONCURRENCY, value: "1"}
            - {name: AI_COMMAND_CONSUMER_GROUP, value: maintenance-task-worker}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          # 회의 녹음 전사: 녹음(최대 500MiB) 다운로드와 디코딩한 chunk WAV를 /tmp에 둔다.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1536Mi
