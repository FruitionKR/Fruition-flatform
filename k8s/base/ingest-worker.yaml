# Kafka `ai.ingest.command` 컨슈머 (consumer group: ingest-worker).
# replicas는 KEDA ScaledObject가 1~4로 관리한다 (keda-scaledobject.yaml).
# HTTP 서버가 없어 probe는 프로세스 생존(컨테이너 종료 시 재시작) 수준으로 둔다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  namespace: fruition
  labels:
    app: ingest-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
    spec:
      containers:
        - name: ingest-worker
          image: fruition-mvp-dev-ingest-worker:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.ingest_worker"]
          env:
            - name: AI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DATABASE_URL
            - name: AI_DB_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AI_DB_MIGRATION_URL
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: INTERNAL_CALLBACK_TOKEN
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: AGENT_INTERNAL_TOKEN
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: S3_SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: ANTHROPIC_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: LANGSMITH_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fruition-secret
                  key: TAVILY_API_KEY
          envFrom:
            - configMapRef:
                name: fruition-config
          volumeMounts:
            - name: runs
              mountPath: /app/runs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: runs
          emptyDir: {}
