# 스크레이프 대상은 호스트에서 bootRun으로 도는 백엔드다 (scripts/dev-up.sh, back-up.sh).
# actuator는 업무 포트가 아니라 관리 포트에 있다 — application.properties의 management.server.port.
# compose.containerized.yml로 백엔드를 컨테이너로 띄웠다면 대상을 document-svc:8082 / access-svc:8083으로
# 바꾸고, 이 컨테이너를 해당 compose의 네트워크에 붙여야 한다.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: document-svc
      - targets: ["host.docker.internal:8083"]
        labels:
          service: access-svc

  # Kafka 브로커가 보는 consumer group lag. 워커(Python)에는 자체 지표가 없어
  # 큐 적체는 여기서만 관측된다. KEDA가 스케일 기준으로 삼는 값과 같은 것을 본다.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # AI pipeline API(FastAPI). 컨테이너 포트가 127.0.0.1에만 publish돼 있어
  # host.docker.internal로는 닿지 않는다 — infra 네트워크에서 이름으로 붙는다.
  - job_name: pipeline-api
    static_configs:
      - targets: ["pipeline-api:8000"]
        labels:
          service: pipeline-api
