# 저장소에 커밋한 대시보드를 기동 시 자동 등록한다. UI에서 import할 필요가 없다.
# allowUiUpdates=false: UI 수정은 저장되지 않는다. 대시보드의 단일 소스는 JSON 파일이다.
apiVersion: 1

providers:
  - name: fruition
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
