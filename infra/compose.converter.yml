# PDF 변환 worker. Kafka `ai.convert.command`를 소비한다(ai ADR 0034). HTTP 포트는 없다.
# compose.infra.yml·compose.ai.yml과 같은 project(fruition-mvp-dev)로 함께 올려 kafka·minio·postgresql 서비스 이름으로 접속한다.
name: fruition-mvp-dev

services:
  markitdown:
    build:
      context: ../../AI
      dockerfile: converter/Dockerfile
    container_name: fruition-markitdown
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      OCR_LANGUAGE: kor+eng
      OCR_TIMEOUT_SECONDS: 600
      MARKDOWN_TIMEOUT_SECONDS: 300
      PDF_DIAGNOSTIC_TIMEOUT_SECONDS: 60
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 사용량 원장(ai_model_usage)과 작업 journal(ai_task_runs) 기록용 converter 전용 계정.
      AI_DATABASE_URL: postgresql://${AI_DB_CONVERTER_USER:-ai_converter}:${AI_DB_CONVERTER_PASSWORD:-ai_converter_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CONVERT_COMMAND_TOPIC: ${CONVERT_COMMAND_TOPIC:-ai.convert.command}
      AI_TASK_EVENT_TOPIC: ${AI_TASK_EVENT_TOPIC:-ai.task.event}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fruition-storage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fruition}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fruition_dev_secret}
    # SIGTERM 뒤에도 진행 중인 command를 끝낸다(최대 7200초). k8s의 terminationGracePeriodSeconds와 같다.
    stop_grace_period: 7800s
