# 배포 단위(인스턴스) 검증용 compose.
# document-svc·access-svc까지 컨테이너로 올려 AWS 배포와 같은 "이미지 단위 실행"을 로컬에서 재현한다.
# 사용: docker compose --env-file .env \
#        -f compose.infra.yml -f compose.ai.yml \
#        -f compose.converter.yml -f compose.containerized.yml up -d --build
# 다중 인스턴스 검증: 위 명령에 --scale document-svc=2 추가 (ports 충돌 시 published 포트 제거 후 LB 경유).
name: fruition-mvp-dev

services:
  pipeline-api:
    environment:
      ACCESS_INTERNAL_BASE_URL: http://access-svc:8081
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
    depends_on:
      access-svc:
        condition: service_healthy

  ingest-worker:
    environment:
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
    depends_on:
      document-svc:
        condition: service_healthy

  query-task-worker:
    environment:
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
      ACCESS_INTERNAL_BASE_URL: http://access-svc:8081
    depends_on:
      document-svc: {condition: service_healthy}

  agent-task-worker:
    environment:
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
      ACCESS_INTERNAL_BASE_URL: http://access-svc:8081
    depends_on:
      document-svc: {condition: service_healthy}

  maintenance-task-worker:
    environment:
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
      ACCESS_INTERNAL_BASE_URL: http://access-svc:8081
    depends_on:
      document-svc: {condition: service_healthy}

  pipeline-agent-worker:
    environment:
      # host gateway가 아니라 컨테이너 네트워크로 붙어야 document-svc published 포트 없이도 동작한다
      AGENT_BACKEND_URL: http://document-svc:8080
    depends_on:
      document-svc:
        condition: service_healthy

  document-svc:
    build:
      context: ../../Document
      dockerfile: Dockerfile
    container_name: fruition-document-svc-dev
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      # document-svc는 core_db 전용 계정으로 접속한다 (runtime=DML, migration=flyway)
      CORE_DB_NAME: ${CORE_DB_NAME:-core_db}
      CORE_DB_RUNTIME_USER: ${CORE_DB_RUNTIME_USER:-core_runtime}
      CORE_DB_RUNTIME_PASSWORD: ${CORE_DB_RUNTIME_PASSWORD:-core_runtime_dev_password}
      CORE_DB_MIGRATION_USER: ${CORE_DB_MIGRATION_USER:-core_migration}
      CORE_DB_MIGRATION_PASSWORD: ${CORE_DB_MIGRATION_PASSWORD:-core_migration_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INGEST_COMMAND_TOPIC: ${INGEST_COMMAND_TOPIC:-ai.ingest.command}
      QUERY_COMMAND_TOPIC: ${QUERY_COMMAND_TOPIC:-ai.query.command}
      AGENT_COMMAND_TOPIC: ${AGENT_COMMAND_TOPIC:-ai.agent.command}
      MAINTENANCE_COMMAND_TOPIC: ${MAINTENANCE_COMMAND_TOPIC:-ai.maintenance.command}
      AI_TASK_EVENT_TOPIC: ${AI_TASK_EVENT_TOPIC:-ai.task.event}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fruition}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fruition_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-fruition-storage}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please-32bytes-min}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN:-local-internal-callback}
      # access-svc 내부 호출(/internal/authz, /internal/users) — 컨테이너 네트워크 경유
      ACCESS_INTERNAL_BASE_URL: http://access-svc:8081
      # ai-svc(pipeline) 내부 호출 — 컨테이너 네트워크 경유
      PROCESSING_ENDPOINT: http://pipeline-api:8000/pipeline/runs
      CHAT_PROCESSING_ENDPOINT: http://pipeline-api:8000/chat-wiki/runs
      QUERY_ENDPOINT: http://pipeline-api:8000/query
      AGENT_STATUS_ENDPOINT: http://pipeline-api:8000/internal/agent/runs
      AGENT_RUN_ENDPOINT: http://pipeline-api:8000/agent/runs
      SKILL_ENDPOINT: http://pipeline-api:8000/skills
      WIKI_SCHEMA_ENDPOINT: http://pipeline-api:8000/wiki-schema
      WIKI_PAGE_ENDPOINT: http://pipeline-api:8000/wiki/pages
      WIKI_STATE_ENDPOINT: http://pipeline-api:8000/wiki
      # PDF → Markdown 변환기(compose.converter.yml의 markitdown) — 컨테이너 네트워크 경유
      CONVERTER_ENDPOINT: http://markitdown:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-agent-internal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # actuator는 관리 포트(8082)로 분리돼 있다. 컨테이너 내부에서만 호출하므로 publish하지 않는다.
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  access-svc:
    build:
      context: ../../Access
      dockerfile: Dockerfile
    container_name: fruition-access-svc-dev
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # flyway migration은 document-svc가 소유하므로 document-svc 기동 후에 뜬다.
      document-svc:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      # access-svc는 access_db 전용 계정으로 접속한다 (runtime=DML, migration=flyway)
      ACCESS_DB_NAME: ${ACCESS_DB_NAME:-access_db}
      ACCESS_DB_RUNTIME_USER: ${ACCESS_DB_RUNTIME_USER:-access_runtime}
      ACCESS_DB_RUNTIME_PASSWORD: ${ACCESS_DB_RUNTIME_PASSWORD:-access_runtime_dev_password}
      ACCESS_DB_MIGRATION_USER: ${ACCESS_DB_MIGRATION_USER:-access_migration}
      ACCESS_DB_MIGRATION_PASSWORD: ${ACCESS_DB_MIGRATION_PASSWORD:-access_migration_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please-32bytes-min}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN:-local-internal-callback}
      # document-svc 내부 호출(/internal/workspaces/*/initial-note) — 컨테이너 네트워크 경유
      DOCUMENT_INTERNAL_BASE_URL: http://document-svc:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:-http://localhost:3000/oauth/callback}
    ports:
      - "${ACCESS_PORT:-8081}:8081"
    healthcheck:
      # actuator는 관리 포트(8083)로 분리돼 있다. 컨테이너 내부에서만 호출하므로 publish하지 않는다.
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
